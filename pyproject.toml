[project]
name = "mira-foundation"
version = "0.4.1"
description = "MIRA local-first control-plane foundation; live integrations are not enabled"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi==0.128.2", "pydantic==2.13.4", "uvicorn==0.48.0", "wsproto==1.3.2", "python-dotenv==1.2.2",
  "httpx==0.28.1", "google-cloud-speech==2.40.0", "google-auth[requests]==2.59.1",
  "PyJWT[crypto]==2.15.1", "cryptography==50.0.0", "Pillow==12.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["apps/api/src"]
testpaths = ["tests/unit", "tests/integration", "tests/architecture", "tests/contracts"]
asyncio_mode = "strict"
addopts = "-ra --strict-markers"
filterwarnings = ["error"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["apps/api/src"]

[project.scripts]
mira = "mira.__main__:main"

[tool.setuptools.package-data]
"mira.adapters.story" = ["assets/*.json"]
"mira.adapters.generation.replay" = ["fixtures/*.json"]
"mira.adapters.generation.rehearsal" = ["fixtures/audio/*.json", "fixtures/audio/*.pcm", "fixtures/audio/*.wav"]

# Preserve the config/web layout expected by project_root() after installation.
# verify_package.py checks every emitted JS/public asset against the installed wheel.
[tool.setuptools.data-files]
"config" = ["config/defaults.toml"]
"config/profiles" = ["config/profiles/*.toml"]
"apps/web" = ["apps/web/index.html", "apps/web/local-memory.html"]
"apps/web/public" = ["apps/web/public/*.css"]
"apps/web/public/audio" = ["apps/web/public/audio/*.js"]
"apps/web/public/licenses" = ["apps/web/public/licenses/*.txt"]
"apps/web/public/scene" = ["apps/web/public/scene/*.svg", "apps/web/public/scene/*.md", "apps/web/public/scene/*.png", "apps/web/public/scene/*.json"]
"apps/web/public/scene/code-native" = ["apps/web/public/scene/code-native/*.json"]
# Public authored source evidence for exact code-native capability validation.
# These files are package data and are not mounted as HTTP resources.
"apps/web/src/features/presentation" = ["apps/web/src/features/presentation/code-native-character-renderer.ts", "apps/web/src/features/presentation/chapter-presentation.ts", "apps/web/src/features/presentation/scene-executor.ts"]
"apps/web/src/features/session" = ["apps/web/src/features/session/controller.ts"]
"apps/web/src/shared" = ["apps/web/src/shared/protocol.ts"]
"apps/web/src/app" = ["apps/web/src/app/main.ts"]
"apps/web/src/features/presentation/code-native-vendor" = ["apps/web/src/features/presentation/code-native-vendor/*.js"]
"apps/web/dist/app" = ["apps/web/dist/app/*.js", "apps/web/dist/app/*.LEGAL.txt"]
"apps/web/dist/app/chunks" = ["apps/web/dist/app/chunks/*.js", "apps/web/dist/app/chunks/*.LEGAL.txt"]
"apps/web/dist/local-memory" = ["apps/web/dist/local-memory/*.js", "apps/web/dist/local-memory/*.LEGAL.txt"]
"apps/web/dist/features/audio" = ["apps/web/dist/features/audio/*.js"]
"apps/web/dist/features/diagnostics" = ["apps/web/dist/features/diagnostics/*.js"]
"apps/web/dist/features/presentation" = ["apps/web/dist/features/presentation/*.js"]
"apps/web/dist/features/presentation/code-native-vendor" = ["apps/web/dist/features/presentation/code-native-vendor/*.js"]
"apps/web/dist/features/session" = ["apps/web/dist/features/session/*.js"]
"apps/web/dist/shared" = ["apps/web/dist/shared/*.js"]
"apps/web/dist/shared/generated" = ["apps/web/dist/shared/generated/*.js"]
"apps/web/dist/licenses" = ["apps/web/dist/licenses/*.txt"]
